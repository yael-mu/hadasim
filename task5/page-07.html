<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
            width: 800px;
            height: 300px
        }

        .box {
            position: absolute;
            top: 100px;
            left: 200px;
            width: 150px;
            padding-left: 30px;
            margin-top: 5%
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
    <ol>
        <li>Compute .box left offset in px.</li>
        <li>Compute .box top offset in px.</li>
        <li>Compute .box padding-left in px.</li>
    </ol>

</body>

</html>
