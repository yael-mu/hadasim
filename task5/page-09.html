<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-size: 17px
        }

        body {
            font-size: 16px
        }

        .panel {
            width: 700px;
            font-size: 17px
        }

        .panel .title {
            font-size: 34px
        }

        .panel .content {
            font-size: 1.25em
        }

        .panel .content p {
            font-size: 13.6px
        }

        .pad {
            padding-top: 1.6px
        }
    </style>

</head>

<body>
    <div class="panel pad">
        <div class="title">Title</div>
        <div class="content">
            <p>Paragraph</p>
        </div>
    </div>
    <ol>
        <li>Compute .panel .title font-size in px.</li>
        <li>Compute .panel .content p font-size in px.</li>
        <li>Compute .panel.pad padding-top in px.</li>
    </ol>

</body>

</html>
