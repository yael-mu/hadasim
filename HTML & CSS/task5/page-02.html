<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-size: 16px
        }

        .outer {
            font-size: 20px
        }

        .middle {
            font-size: 25px
        }

        .inner {
            font-size: 20px
        }

        .inner p {
            font-size: 30px
        }
    </style>

</head>

<body>
    <div class="outer">
        <div class="middle">
            <div class="inner">
                <p>Deep</p>
            </div>
        </div>
    </div>
    <ol>
        <li>Compute .middle font-size in px.</li>
        <li>Compute .inner font-size in px.</li>
        <li>Compute .inner p font-size in px.</li>
    </ol>

</body>

</html>
