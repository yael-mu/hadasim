<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-size: 19px
        }

        .wrap {
            width: 819.6px;
            height: 512px
        }

        .wrap h2 {
            font-size: 28.5px
        }

        .wrap p {
            font-size: 0.75rem
        }

        .wrap .spaced {
            margin-top: 25.6px
        }
    </style>

</head>

<body>
    <div class="wrap">
        <h2>Heading</h2>
        <p>Body</p>
        <div class="spaced">Spacer</div>
    </div>
    <ol>
        <li>Assume viewport 1366 by 1024. Compute .wrap width and height in px.</li>
        <li>Compute .wrap h2 font-size in px.</li>
        <li>Assume viewport 1366 by 1024. Compute .wrap .spaced margin-top in px.</li>
    </ol>

</body>

</html>
